    // Web Audio API 擬真鳥鳴合成器 (完全無需外部 MP3 檔案)
    let audioCtx = null;
    let isPlaying = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 各鳥種專屬聲學特徵振盪程序
    function synthesizeBirdSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);
      masterGain.gain.setValueAtTime(0.3, now);

      if (type === "sparrow") {
        // 麻雀：雙重短促啁啾 (2.8kHz -> 4.2kHz -> 2.5kHz)
        [0, 0.22].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.connect(gain);
          gain.connect(masterGain);

          const t = now + offset;
          osc.frequency.setValueAtTime(2800, t);
          osc.frequency.exponentialRampToValueAtTime(4600, t + 0.05);
          osc.frequency.exponentialRampToValueAtTime(2600, t + 0.12);

          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

          osc.start(t);
          osc.stop(t + 0.14);
        });
      } 
      else if (type === "bulbul") {
        // 白頭翁：「巧克力~巧克力」三連音調頻 (約 2kHz ~ 3.5kHz 帶顫音)
        const notes = [
          { f: 2200, d: 0.14, pause: 0.04 },
          { f: 2800, d: 0.12, pause: 0.04 },
          { f: 3400, d: 0.20, pause: 0.10 }
        ];
        let curTime = now;
        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.connect(gain);
          gain.connect(masterGain);

          osc.frequency.setValueAtTime(n.f - 200, curTime);
          osc.frequency.linearRampToValueAtTime(n.f + 400, curTime + n.d * 0.5);
          osc.frequency.linearRampToValueAtTime(n.f, curTime + n.d);

          gain.gain.setValueAtTime(0.001, curTime);
          gain.gain.linearRampToValueAtTime(0.45, curTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, curTime + n.d);

          osc.start(curTime);
          osc.stop(curTime + n.d + 0.01);
          curTime += n.d + n.pause;
        });
      }
      else if (type === "whiteeye") {
        // 綠繡眼：高頻細緻銀鈴聲 (4.8kHz ~ 6.5kHz 急促滑音)
        for (let i = 0; i < 4; i++) {
          const t = now + i * 0.08;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.connect(gain);
          gain.connect(masterGain);

          osc.frequency.setValueAtTime(5000 + (i % 2) * 800, t);
          osc.frequency.linearRampToValueAtTime(6400, t + 0.03);
          osc.frequency.linearRampToValueAtTime(4800, t + 0.06);

          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.3, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);

          osc.start(t);
          osc.stop(t + 0.07);
        }
      }
      else if (type === "heron") {
        // 黑冠麻鷺：極低頻沉悶震動喉音 (150Hz ~ 110Hz 三角波)
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.connect(gain);
        gain.connect(masterGain);

        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.55);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.7, now + 0.15);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.start(now);
        osc.stop(now + 0.62);
      }
      else if (type === "blackbulbul") {
        // 紅嘴黑鵯：擬貓叫下降滑音「喵～」 (2200Hz 緩降至 1100Hz 鋸齒帶濾波)
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = "sawtooth";
        filter.type = "bandpass";
        filter.Q.value = 3.5;
        filter.frequency.setValueAtTime(1800, now);
        filter.frequency.linearRampToValueAtTime(1100, now + 0.65);

        osc.frequency.setValueAtTime(2200, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.65);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);

        osc.start(now);
        osc.stop(now + 0.7);
      }
      else if (type === "myna") {
        // 白尾八哥：金屬摩擦短顫音與哨音
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.connect(gain);
        gain.connect(masterGain);

        osc.frequency.setValueAtTime(1300, now);
        osc.frequency.setValueAtTime(1850, now + 0.08);
        osc.frequency.setValueAtTime(1100, now + 0.16);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.start(now);
        osc.stop(now + 0.32);
      }
    }

    // 全域狀態管理
    let selectedBirdId = birdDB[0].id;
    let currentLayerFilter = "all";

    // 初始化應用程式
    function initBirdGuide() {
      renderBirdGrid();
      selectBird(birdDB[0].id);
      buildQuizView();
    }

    // 建立鳥類卡片網格
    function renderBirdGrid() {
      const grid = document.getElementById("bird-grid");
      const filtered = birdDB.filter(b => currentLayerFilter === "all" || b.layer === currentLayerFilter);
      
      document.getElementById("filtered-count").innerText = `共 ${filtered.length} 種`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm font-medium">此微棲地層目前無收錄鳥種</div>`;
        return;
      }

      grid.innerHTML = filtered.map(bird => {
        const isSelected = bird.id === selectedBirdId;
        return `
          <div onclick="selectBird('${bird.id}')" 
               class="touch-target cursor-pointer bg-slate-900 border-2 rounded-2xl p-3.5 sm:p-4 flex flex-col justify-between transition-all select-none ${isSelected ? 'bird-card-active border-amber-500' : 'border-slate-800 hover:border-slate-700 active:scale-95'}">
            <div>
              <div class="flex items-center justify-between gap-1.5 mb-2.5">
                <span class="text-3xl sm:text-4xl">${bird.icon}</span>
                <span class="text-[11px] sm:text-xs px-2 py-0.5 rounded-md font-bold border ${bird.badgeColor} truncate max-w-[110px]">
                  ${bird.role.split("｜")[0]}
                </span>
              </div>
              <h3 class="text-base sm:text-lg font-black text-white leading-tight mb-0.5">${bird.name}</h3>
              <p class="text-[11px] sm:text-xs font-mono text-slate-400 italic truncate font-semibold">${bird.scientificName}</p>
            </div>
            <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-300 font-medium">
              <span class="truncate">${bird.layerName.split(" ")[0]}</span>
              <span class="text-amber-400 font-bold text-xs sm:text-sm">查看 →</span>
            </div>
          </div>
        `;
      }).join("");
    }

    // 選取特定鳥種並渲染詳細面版
    function selectBird(birdId) {
      selectedBirdId = birdId;
      const bird = birdDB.find(b => b.id === birdId);
      if (!bird) return;

      // 重新標記卡片選取狀態
      renderBirdGrid();

      // 更新卡片頭部資訊
      document.getElementById("detail-icon").innerText = bird.icon;
      document.getElementById("detail-name").innerText = bird.name;
      document.getElementById("detail-latin").innerText = bird.scientificName;
      
      const badge = document.getElementById("detail-badge");
      badge.innerText = bird.role;
      badge.className = `px-2 py-0.5 rounded text-[11px] font-bold border ${bird.badgeColor}`;

      document.getElementById("detail-layer-badge").innerText = bird.layerName;

      // 更新三大辨識要點
      const eyesList = document.getElementById("detail-eyes");
      eyesList.innerHTML = bird.eyes.map(item => `<li>${item}</li>`).join("");

      document.getElementById("detail-habits").innerText = bird.habits;
      document.getElementById("detail-sound-tip").innerText = bird.soundTip;
      document.getElementById("detail-sound-desc").innerText = bird.soundDesc;

      // 重設聲音播放按鈕狀態
      resetAudioButton();
    }

    // 微棲地分層過濾
    function filterLayer(layer, btnElement) {
      currentLayerFilter = layer;
      
      // 更新按鈕外觀
      document.querySelectorAll(".layer-pill").forEach(el => {
        el.className = "layer-pill touch-target shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold border transition-all bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700";
      });
      btnElement.className = "layer-pill active-pill touch-target shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all bg-amber-500 text-slate-950 border-amber-400 shadow-md";

      // 重新過濾卡片
      renderBirdGrid();

      // 若目前選取的鳥不在過濾清單中，自動選取第一個符合條件的鳥種
      const currentExists = birdDB.some(b => (layer === "all" || b.layer === layer) && b.id === selectedBirdId);
      if (!currentExists) {
        const firstMatch = birdDB.find(b => layer === "all" || b.layer === layer);
        if (firstMatch) selectBird(firstMatch.id);
      }
    }

    // 播放當前選中鳥種的聲音
    function playCurrentBirdSound() {
      const bird = birdDB.find(b => b.id === selectedBirdId);
      if (!bird) return;

      const waveEl = document.getElementById("sound-wave");
      const labelEl = document.getElementById("audio-btn-label");
      const iconEl = document.getElementById("audio-btn-icon");

      waveEl.classList.remove("hidden");
      waveEl.classList.add("flex");
      labelEl.innerText = "播放中...";
      iconEl.innerText = "🎶";

      synthesizeBirdSound(bird.audioPattern);

      setTimeout(() => {
        resetAudioButton();
      }, 900);
    }

    function resetAudioButton() {
      const waveEl = document.getElementById("sound-wave");
      const labelEl = document.getElementById("audio-btn-label");
      const iconEl = document.getElementById("audio-btn-icon");
      if (waveEl) {
        waveEl.classList.remove("flex");
        waveEl.classList.add("hidden");
        labelEl.innerText = "聽模擬鳴聲";
        iconEl.innerText = "🔊";
      }
    }

    // 主介面模式切換 (圖鑑 vs 測驗)
    function switchMainMode(mode) {
      const guideView = document.getElementById("view-guide");
      const quizView = document.getElementById("view-quiz");
      const guideBtn = document.getElementById("mode-guide-btn");
      const quizBtn = document.getElementById("mode-quiz-btn");

      if (mode === 'guide') {
        guideView.classList.remove("hidden");
        quizView.classList.add("hidden");
        guideBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow";
        quizBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
      } else {
        guideView.classList.add("hidden");
        quizView.classList.remove("hidden");
        quizBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500 text-slate-950 shadow";
        guideBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
      }
    }

    // 3 道校園情境題目庫
    const quizData = [
      {
        q: "1. 下午在校園樹蔭下的草皮上，看到一隻中型鳥類脖子伸得筆直、定格數分鐘一動也不動，彷彿在偽裝枯木，隨後突然將長嘴插進泥土裡，牠最可能是誰？",
        options: [
          "白頭翁（正在尋找掉落漿果）",
          "黑冠麻鷺（正在感應並拔出蚯蚓）",
          "紅嘴黑鵯（正在地面躲避強風）",
          "綠繡眼（正在草皮洗泥土浴）"
        ],
        ans: 1,
        explain: "黑冠麻鷺以動作極慢、定格擬態枯木著稱，是校園草皮上的「大笨鳥」，主食蚯蚓與土壤無脊椎動物。"
      },
      {
        q: "2. 在校園櫻花樹開花時，發現一群身型極小（約11公分）、背部亮黃綠色的小鳥在花叢間敏捷地「倒吊」吸蜜，眼睛周圍有一圈明顯的白色羽毛，牠是：",
        options: [
          "麻雀",
          "綠繡眼",
          "白尾八哥",
          "紅嘴黑鵯"
        ],
        ans: 1,
        explain: "綠繡眼體型微小且輕盈，具有極具識別度的白色眼圈，常在枝頭倒吊吸食花蜜或捕捉微小昆蟲。"
      },
      {
        q: "3. 在學校大樓窗台與冷氣外機旁，常看見一種鳥類嘴與腳呈鮮黃色，飛行時翅膀展開有明顯大白斑，成群喧鬧搶食甚至排擠本土鳥類築巢，這是哪一種鳥？",
        options: [
          "白尾八哥（強勢外來入侵種）",
          "白頭翁（臺灣特有亞種）",
          "黑冠麻鷺（保育類鷺科）",
          "麻雀（特化高山種）"
        ],
        ans: 0,
        explain: "白尾八哥具有黃嘴黃腳與翅膀白斑特徵，屬於外來入侵種，適應力強且極具攻擊性，已在全台校園嚴重佔據本土鳥類生存空間。"
      }
    ];

    let userAnswers = {};

    function buildQuizView() {
      const container = document.getElementById("quiz-question-list");
      container.innerHTML = quizData.map((item, qIdx) => `
        <div class="bg-slate-950 p-4 sm:p-5 rounded-2xl border border-slate-800 space-y-3.5">
          <p class="text-sm sm:text-base font-bold text-slate-100 leading-snug">${item.q}</p>
          <div class="space-y-2.5">
            ${item.options.map((opt, optIdx) => `
              <button onclick="handleQuizAnswer(${qIdx}, ${optIdx}, this)" 
                      id="quiz-btn-${qIdx}-${optIdx}"
                      class="quiz-opt-btn w-full text-left touch-target p-3 sm:p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs sm:text-sm text-slate-200 hover:border-slate-700 active:scale-[0.99] transition flex items-center justify-between font-medium">
                <span class="pr-2 leading-relaxed">${opt}</span>
                <span id="quiz-icon-${qIdx}-${optIdx}" class="text-base sm:text-lg font-black shrink-0"></span>
              </button>
            `).join("")}
          </div>
          <div id="quiz-explain-${qIdx}" class="hidden p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed mt-2.5 font-medium"></div>
        </div>
      `).join("");
    }

    function handleQuizAnswer(qIndex, selectedOption, btn) {
      if (userAnswers[qIndex] !== undefined) return; // 已作答則鎖定
      userAnswers[qIndex] = selectedOption;

      const item = quizData[qIndex];
      const isCorrect = selectedOption === item.ans;
      const explainBox = document.getElementById(`quiz-explain-${qIndex}`);

      // 標記選項按鈕狀態
      item.options.forEach((_, optIdx) => {
        const b = document.getElementById(`quiz-btn-${qIndex}-${optIdx}`);
        const icon = document.getElementById(`quiz-icon-${qIndex}-${optIdx}`);
        if (optIdx === item.ans) {
          b.className = "w-full text-left touch-target p-3 sm:p-3.5 rounded-xl bg-emerald-950/80 border-2 border-emerald-500 text-emerald-200 text-xs sm:text-sm font-bold flex items-center justify-between";
          icon.innerText = "✔";
        } else if (optIdx === selectedOption && !isCorrect) {
          b.className = "w-full text-left touch-target p-3 sm:p-3.5 rounded-xl bg-rose-950/80 border-2 border-rose-500 text-rose-200 text-xs sm:text-sm font-bold flex items-center justify-between";
          icon.innerText = "✘";
        } else {
          b.className = "w-full text-left touch-target p-3 sm:p-3.5 rounded-xl bg-slate-900/40 border border-slate-800/40 text-slate-500 text-xs sm:text-sm flex items-center justify-between cursor-not-allowed";
        }
      });

      // 顯示詳解
      explainBox.classList.remove("hidden");
      if (isCorrect) {
        explainBox.className = "p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed mt-2.5 bg-emerald-950/50 border border-emerald-700 text-emerald-200";
        explainBox.innerHTML = `<strong>✔ 答對了！</strong> ${item.explain}`;
      } else {
        explainBox.className = "p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed mt-2.5 bg-rose-950/50 border border-rose-700 text-rose-200";
        explainBox.innerHTML = `<strong>✘ 觀念釐清：</strong> ${item.explain}`;
      }

      // 更新作答進度與成績
      updateQuizProgress();
    }

    function updateQuizProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.ans) correctCount++;
      });

      const banner = document.getElementById("quiz-score-banner");
      if (answeredCount === quizData.length) {
        const score = Math.round((correctCount / quizData.length) * 100);
        banner.innerHTML = `<span class="text-amber-400 font-bold">測驗完成！得分：${score} 分（答對 ${correctCount} / ${quizData.length} 題）</span>`;
      } else {
        banner.innerText = `已完成 ${answeredCount} / ${quizData.length} 題`;
      }
    }

    function resetQuiz() {
      userAnswers = {};
      buildQuizView();
      document.getElementById("quiz-score-banner").innerText = "作答後即時顯示解析";
    }

    // 啟動應用程式
    window.addEventListener("DOMContentLoaded", initBirdGuide);
  </script>
</body>
</html>
